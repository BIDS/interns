name: Issues Deadline Reminders

on:
  schedule:
    # 15:00 UTC corresponds to 8:00 AM Pacific Daylight Time (PDT)
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  check-deadlines:
    runs-on: ubuntu-latest
    steps:
      - name: Scan Project for Deadlines Due Tomorrow
        uses: petrandr/duedate_reminders@v1.3
        with:
          gh_token: ${{ secrets.PROJECT_TOKEN }}
          project_number: 18  
          duedate_field_name: "Deadline" 
          notify_for: "expiring_issues"
          notification_type: "comment"
          repository_owner_type: "organization"

